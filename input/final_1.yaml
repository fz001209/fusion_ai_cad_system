use_case: 楼梯攀爬机器人
module: 三星轮模块（Tri-Star Wheel Module）

description: >
  我需要一个用于楼梯攀爬机器人的三星轮模块，作为机器人底盘与地面/台阶接触的核心行走单元。
  从外观上看，该模块应由三只轮子围绕一个中心构成，三只轮子在圆周上均匀分布，呈明显的三折旋转对称结构（120°等分）。
  整个轮组应形成一个紧凑、结实、工业化的机械模块，看起来像一个可直接装到机器人上的成品轮组，而不是实验装置。
  轮子通过轮臂连接到中心区域，轮臂应清晰地从中心向外辐射，不能穿过中心形成长条结构。
  模块中心需要有清晰的机械接口，用于体现模块中心的旋转核心；本模块范围内不建模贯穿中心的 drive shaft，外部驱动连接留给上层总装。

functional_requirements:
  - 整个三星轮模块在工作时需要能够绕中心轴连续旋转，以实现楼梯攀爬过程中的“翻轮”与“换轮接触”
  - 三个轮子在接触地面或台阶时，需要能够各自独立滚动，轮子的转动不应被轮臂或中心结构限制
  - 在任何姿态下，模块的结构都应保持对称与稳定，不应出现单侧受力或明显偏载
  - 模块在运行过程中不得出现轮子之间、轮子与轮臂、轮子与中心结构之间的几何干涉

performance_requirements:
  payload_capacity_kg: 20
  expected_robot_mass_kg: 30
  operating_environment:
    - 室内与室外楼梯
    - 常见住宅与公共建筑楼梯
  stair_geometry:
    step_height_mm_range: [160, 200]
    step_depth_mm_range: [250, 320]
  mobility_expectations:
    - 在平地上应具备平稳滚动能力
    - 在楼梯边缘接触时应具备足够抓地力，避免明显打滑
    - 轮胎在不同接触角度下仍应保持可预测的摩擦行为

appearance_and_form:
  - 整体外形应偏向工业产品风格，而非实验室原型
  - 模块轮廓应简洁、有明确受力逻辑，看起来“该厚的地方厚、该加强的地方加强”
  - 轮臂与载体结构应给人以刚性充足、可靠的感觉
  - 中心区域应明显区分为“旋转核心”，而非与轮臂混为一体

wheel_and_contact_expectations:
  - 轮子应具备清晰的轮胎结构，而不是光滑圆柱
  - 轮胎表面应具有用于增强抓地力的花纹或沟槽结构
  - 花纹形式应适合楼梯边缘与平地混合工况，避免只适合平地或只适合软地面
  - 轮胎材料应具有一定弹性和耐磨性，在重复爬楼工况下不易快速磨损
  - 轮胎宽度与直径应与承载能力和楼梯尺寸相匹配，不应显得过窄或过小

structural_and_mechanical_expectations:
  - 模块内部应形成完整、合理的载荷传递路径，从轮胎接触点到模块中心旋转接口
  - 所有转动部位应具备明确、可靠的机械支撑方式，避免悬空或不受约束的转动
  - 结构设计应考虑长期重复受载，不应依赖“悬臂+运气”来维持稳定
  - 各部件之间的连接方式应符合常见机械设计逻辑，而非临时拼接

manufacturing_and_product_quality:
  - 该模块应被视为一个可交付的最终产品，而不是仅用于展示的模型
  - 结构形式应符合常见机械加工与装配方式，避免明显不可制造的几何
  - 即使不展开全部制造细节，整体结构应“看起来就能被造出来”

